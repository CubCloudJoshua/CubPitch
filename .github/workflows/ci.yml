name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck the editor
        run: pnpm exec tsc -p apps/web/tsconfig.json

      - name: Test
        run: pnpm test

      # The browser is only needed for the export end-to-end checks, so it is
      # installed after the fast checks have already had a chance to fail.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Export end to end
        env:
          CUBPITCH_E2E: '1'
        run: pnpm test

      - name: Check the sample deck still fits its canvas
        env:
          CUBPITCH_MEASURE: '1'
        run: pnpm test tests/_measure.test.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exported-deck
          path: .artifacts/
          if-no-files-found: ignore
